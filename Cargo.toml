[workspace]
members = [
    "apps/luna-ui-rust-demo",
    "apps/luna-ui-rust-editor-demo",
    "apps/luna-ui-rust-native-demo",
    "apps/luna-ui-rust-proof-gallery",
    "apps/luna-ui-rust-text-demo",
    "crates/luna-accessibility",
    "crates/luna-accessibility-accesskit",
    "crates/luna-commands",
    "crates/luna-core",
    "crates/luna-documents",
    "crates/luna-document-services",
    "crates/luna-host-core",
    "crates/luna-host-winit",
    "crates/luna-host-wgpu",
    "crates/luna-input",
    "crates/luna-layout",
    "crates/luna-panes",
    "crates/luna-render",
    "crates/luna-render-wgpu",
    "crates/luna-session",
    "crates/luna-text",
    "crates/luna-text-cosmic",
    "crates/luna-theme",
    "crates/luna-ui",
    "crates/luna-workspaces",
]
resolver = "3"

[workspace.dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
accesskit = "=0.24.1"
accesskit_winit = "=0.33.2"
cosmic-text = "=0.19.0"
softbuffer = "=0.4.8"
pollster = "=0.4.0"
wgpu = "=29.0.3"
unicode-segmentation = "=1.13.3"
winit = "=0.30.13"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
authors = ["Adam Vadala-Roth"]
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
