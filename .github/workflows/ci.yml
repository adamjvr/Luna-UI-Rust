name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    name: M8.3 Linux qualification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Run M8.3.1 repair and M8.3 Linux gates
        run: |
          ./scripts/test-m8-3-1.sh
          ./scripts/test-m8-3.sh

  macos-advisory:
    name: M8.4 macOS 15 Apple-Silicon advisory
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Run M8.4 Apple-Silicon advisory gate
        run: ./scripts/test-m8-4-macos.sh
